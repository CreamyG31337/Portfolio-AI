<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Trading Dashboard</title>
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link href="/assets/css/tailwind.css?v=2" rel="stylesheet">
    <script>
        // Match dashboard theme so CSS variables resolve correctly
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>
<body class="bg-dashboard-background text-text-primary min-h-screen flex items-center justify-center p-4">
    <div class="bg-dashboard-surface p-8 rounded-lg shadow-md w-full max-w-md border border-border">
        <h1 class="text-2xl font-bold text-center mb-6">Login</h1>
        <form id="loginForm">
            <div class="mb-4">
                <label for="email" class="block mb-2 text-sm font-medium">Email</label>
                <input type="email" id="email" name="email" class="bg-dashboard-surface border border-border text-text-primary text-sm rounded-lg focus:ring-accent focus:border-accent block w-full p-2.5" required autocomplete="email">
            </div>
            <div class="mb-4">
                <label for="password" class="block mb-2 text-sm font-medium">Password</label>
                <input type="password" id="password" name="password" class="bg-dashboard-surface border border-border text-text-primary text-sm rounded-lg focus:ring-accent focus:border-accent block w-full p-2.5" required autocomplete="current-password">
            </div>
            <button type="submit" id="submitBtn" class="w-full text-white bg-accent hover:bg-accent-hover focus:ring-4 focus:outline-none focus:ring-accent/30 font-medium rounded-lg text-sm px-5 py-2.5 text-center mt-2">Login</button>
            <div class="hidden mt-4 p-4 text-sm text-theme-error-text bg-theme-error-bg rounded-lg border border-theme-error-border" id="errorMsg"></div>
        </form>
        <div class="hidden mt-4 text-center text-text-secondary text-sm" id="loadingMsg">Logging in...</div>
    </div>
    
    <script>
        // Get Supabase config - will be injected by server or passed as URL params
        // For browser automation, pass as: /login.html?supabase_url=...&supabase_key=...
        function getSupabaseConfig() {
            // Hardcoded Supabase URL and key (public, safe to expose)
            // These are the anon/publishable keys, not secret keys
            const DEFAULT_URL = 'https://injqbxdqyxfvannygadt.supabase.co';
            const DEFAULT_KEY = 'sb_publishable_R_b-froDVtQajU1omB0bRA_g3A6YsLU';
            
            // 1. Try URL params first (for browser automation/testing)
            const urlParams = new URLSearchParams(window.location.search);
            let url = urlParams.get('supabase_url');
            let key = urlParams.get('supabase_key');
            
            // 2. Try window object
            if (!url) url = window.SUPABASE_URL;
            if (!key) key = window.SUPABASE_ANON_KEY;
            
            // 3. Try config script tag (injected by server)
            if (!url || !key) {
                const configScript = document.querySelector('script[data-supabase-config]');
                if (configScript) {
                    try {
                        const config = JSON.parse(configScript.textContent);
                        if (!url) url = config.url;
                        if (!key) key = config.key;
                    } catch (e) {
                        console.error('Failed to parse config:', e);
                    }
                }
            }
            
            // Use defaults if not provided (anon key is public, safe to hardcode)
            return { 
                url: url || DEFAULT_URL, 
                key: key || DEFAULT_KEY 
            };
        }
        
        const config = getSupabaseConfig();
        const SUPABASE_URL = config.url;
        const SUPABASE_KEY = config.key;
        
        if (!SUPABASE_URL || !SUPABASE_KEY) {
            document.getElementById('errorMsg').textContent = 'Configuration error: Supabase credentials not found.';
            document.getElementById('errorMsg').classList.remove('hidden');
        }
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            const loadingMsg = document.getElementById('loadingMsg');
            
            // Debug logging
            console.log('Login attempt:', { email: email, passwordLength: password.length, hasUrl: !!SUPABASE_URL, hasKey: !!SUPABASE_KEY, keyLength: SUPABASE_KEY ? SUPABASE_KEY.length : 0 });
            
            // Validate inputs
            if (!email || !password) {
                errorMsg.textContent = 'Please enter both email and password';
                errorMsg.classList.remove('hidden');
                return;
            }
            
            if (!SUPABASE_URL || !SUPABASE_KEY) {
                errorMsg.textContent = 'Configuration error: Supabase credentials not found.';
                errorMsg.classList.remove('hidden');
                return;
            }
            
            // Hide error, show loading
            errorMsg.classList.add('hidden');
            loadingMsg.classList.remove('hidden');
            submitBtn.disabled = true;
            
            try {
                // Call Supabase auth API
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok && data.access_token) {
                    // Success! Redirect to set_cookie.html with token
                    const encodedToken = encodeURIComponent(data.access_token);
                    window.location.href = `/set_cookie.html?token=${encodedToken}`;
                } else {
                    // Show error with more details
                    const errorText = data.msg || data.error_description || data.error || 'Login failed';
                    console.error('Login failed:', { status: response.status, error: errorText, data: data });
                    errorMsg.textContent = `Login failed: ${errorText}`;
                    errorMsg.classList.remove('hidden');
                    loadingMsg.classList.add('hidden');
                    submitBtn.disabled = false;
                }
            } catch (error) {
                errorMsg.textContent = 'Network error: ' + error.message;
                errorMsg.classList.remove('hidden');
                loadingMsg.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

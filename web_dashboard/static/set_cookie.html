<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session...</title>
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link href="/assets/css/tailwind.css?v=2" rel="stylesheet">
    <script>
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>

<body class="bg-dashboard-background text-text-primary min-h-screen flex items-center justify-center p-4">
    <div class="bg-dashboard-surface p-8 rounded-lg shadow-md w-full max-w-md border border-border text-center border-l-4 border-l-border" id="messageContainer">
        <div class="text-xl font-bold mb-2" id="messageTitle">Processing...</div>
        <div class="text-text-secondary text-sm" id="messageText">Please wait...</div>
        <div class="hidden mt-4 p-4 text-sm text-left break-words whitespace-pre-wrap font-mono text-xs max-h-40 overflow-y-auto rounded-lg border border-border bg-dashboard-background" id="messageReason"></div>
    </div>
    <script>
        (function () {
            // Helper function to set cookie
            function setCookie(name, value, days) {
                var expires = new Date();
                expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
                var secure = window.location.protocol === 'https:' ? '; Secure' : '';
                document.cookie = name + '=' + value + '; expires=' + expires.toUTCString() + '; path=/; SameSite=Lax' + secure;
            }

            // Compute cookie lifetime from JWT exp claim so auth_token cookie expires with the JWT
            function getTokenExpiryDays(token) {
                try {
                    var b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                    var payload = JSON.parse(atob(b64));
                    if (payload.exp) {
                        return Math.max((payload.exp - Date.now() / 1000) / 86400, 1 / 24);
                    }
                } catch (e) {}
                return 1 / 24; // default 1 hour
            }

            // Helper function to clear cookie
            function clearCookie(name) {
                document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            }

            // Helper function to display logout message
            function displayLogoutMessage(reason) {
                var container = document.getElementById('messageContainer');
                var title = document.getElementById('messageTitle');
                var text = document.getElementById('messageText');
                var reasonDiv = document.getElementById('messageReason');

                var messages = {
                    'manual': {
                        title: '✓ Logged Out',
                        text: 'You have been logged out successfully.',
                        showReason: false,
                        isError: false
                    },
                    'session_expired': {
                        title: 'Session Expired',
                        text: 'Your session has expired. Please log in again.',
                        reason: 'Your authentication token expired after a period of inactivity.',
                        showReason: true,
                        isError: true
                    },
                    'refresh_failed': {
                        title: 'Session Could Not Be Refreshed',
                        text: 'We were unable to refresh your session. Please log in again.',
                        reason: 'The automatic session refresh failed. This may happen after server restarts or network issues.',
                        showReason: true,
                        isError: true
                    },
                    'invalid_token': {
                        title: 'Invalid Session',
                        text: 'Your session is invalid. Please log in again.',
                        reason: 'The authentication token could not be validated.',
                        showReason: true,
                        isError: true
                    }
                };

                var msg = messages[reason] || {
                    title: 'Logged Out',
                    text: 'You have been logged out.',
                    reason: 'Logout reason: ' + (reason || 'unknown'),
                    showReason: true,
                    isError: true
                };

                title.textContent = msg.title;
                text.textContent = msg.text;

                if (msg.showReason && msg.reason) {
                    reasonDiv.textContent = msg.reason;
                    reasonDiv.classList.remove('hidden');
                }

                // Success vs error accent on the container left border
                container.classList.remove('border-l-theme-error-text', 'border-l-theme-success-text');
                if (msg.isError) {
                    container.classList.add('border-l-theme-error-text');
                } else {
                    container.classList.add('border-l-theme-success-text');
                }
            }

            var params = new URLSearchParams(window.location.search);
            var action = params.get('action');
            var token = params.get('token');
            var refreshToken = params.get('refresh_token');
            var returnTo = params.get('return_to') || '/';  // Default to root if not specified
            var reason = params.get('reason') || 'manual';  // Get logout reason

            // Ensure returnTo starts with / to prevent open redirects
            if (!returnTo.startsWith('/')) {
                returnTo = '/';
            }

            if (action === 'clear') {
                // Clear both cookies (logout) - show message then redirect
                displayLogoutMessage(reason);
                clearCookie('auth_token');
                clearCookie('refresh_token');

                // Redirect after 3 seconds to allow user to read the message
                setTimeout(function () {
                    window.location.replace(window.location.origin + returnTo);
                }, 3000);
            } else if (token) {
                // Set the cookies (login or refresh)
                setCookie('auth_token', token, getTokenExpiryDays(token));
                if (refreshToken) {
                    setCookie('refresh_token', refreshToken, 30); // 30 days for refresh token
                }
                // Redirect back to where user was
                window.location.replace(window.location.origin + returnTo);
            } else {
                document.getElementById('messageText').textContent = 'No action specified.';
                setTimeout(function () {
                    window.location.replace('/');
                }, 1000);
            }
        })();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Digest expired</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { text-align: center; padding: 32px; max-width: 400px; }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Summary expired</h1>
    <p>This digest link is no longer available. Log in for current portfolio data.</p>
    {% if dashboard_url %}
    <p><a href="{{ dashboard_url }}">Open dashboard</a></p>
    {% endif %}
  </div>
</body>
</html>

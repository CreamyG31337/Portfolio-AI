<!-- Reusable confirmation modal (Flowbite); use via window.showConfirmModal(...) -->
<div id="confirm-modal" tabindex="-1" aria-hidden="true"
    class="fixed top-0 left-0 right-0 z-50 hidden w-full p-4 overflow-x-hidden overflow-y-auto md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative w-full max-w-md max-h-full flex items-center justify-center min-h-[calc(100%-2rem)]">
        <div class="relative bg-dashboard-surface border border-border rounded-xl shadow-lg w-full">
            <div class="p-6 text-center">
                <div id="confirm-modal-icon" class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-dashboard-background border border-border mb-4">
                    <i class="fas fa-question text-text-secondary text-xl"></i>
                </div>
                <h3 id="confirm-modal-title" class="mb-2 text-xl font-semibold text-text-primary">Confirm</h3>
                <p id="confirm-modal-message" class="mb-6 text-sm text-text-secondary"></p>
                <div class="flex gap-3 justify-center">
                    <button type="button" id="confirm-modal-cancel"
                        class="px-4 py-2.5 text-sm font-medium rounded-lg border border-border bg-dashboard-background text-text-primary hover:bg-dashboard-surface-alt focus:ring-2 focus:ring-accent/30 focus:outline-hidden transition-colors">
                        Cancel
                    </button>
                    <!-- Primary Action Button -->
                    <button type="button" id="confirm-modal-submit-primary"
                        class="px-4 py-2.5 text-sm font-medium rounded-lg border border-accent text-accent bg-transparent hover:bg-accent/10 focus:ring-2 focus:ring-accent/30 focus:outline-hidden transition-colors inline-flex items-center justify-center gap-2">
                        Confirm
                    </button>
                    <!-- Danger Action Button -->
                    <button type="button" id="confirm-modal-submit-danger"
                        class="hidden px-4 py-2.5 text-sm font-medium rounded-lg border border-theme-error-text text-theme-error-text bg-theme-error-bg hover:bg-theme-error-text hover:text-theme-error-bg focus:ring-2 focus:ring-theme-error-text/40 focus:outline-hidden transition-colors items-center justify-center gap-2">
                        Confirm
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
(function() {
    var modalId = 'confirm-modal';
    var titleId = 'confirm-modal-title';
    var messageId = 'confirm-modal-message';
    var cancelBtnId = 'confirm-modal-cancel';
    var iconWrapId = 'confirm-modal-icon';
    var primaryBtnId = 'confirm-modal-submit-primary';
    var dangerBtnId = 'confirm-modal-submit-danger';

    // Store modal instance
    var modalInstance = null;

    function getModal() {
        if (modalInstance) return modalInstance;

        var modalEl = document.getElementById(modalId);
        if (!modalEl) return null;

        // Check if Flowbite is available
        if (typeof Modal !== 'undefined') {
            modalInstance = new Modal(modalEl, {
                placement: 'center',
                backdrop: 'dynamic',
                closable: true,
                onHide: () => {
                    // Cleanup if needed
                }
            });
        } else if (window.Flowbite && window.Flowbite.Modal) {
             modalInstance = new window.Flowbite.Modal(modalEl, {
                placement: 'center',
                backdrop: 'dynamic',
                closable: true
            });
        } else {
            // Fallback if Flowbite JS isn't loaded (shouldn't happen in this app)
            console.warn('Flowbite Modal not found, falling back to basic toggle');
            modalInstance = {
                show: function() {
                    modalEl.classList.remove('hidden');
                    modalEl.classList.add('flex');
                    document.body.classList.add('overflow-hidden');
                },
                hide: function() {
                    modalEl.classList.add('hidden');
                    modalEl.classList.remove('flex');
                    document.body.classList.remove('overflow-hidden');
                }
            };
        }
        return modalInstance;
    }

    window.showConfirmModal = function(opts) {
        var title = (opts && opts.title) || 'Confirm';
        var message = (opts && opts.message) != null ? opts.message : '';
        var confirmLabel = (opts && opts.confirmLabel) || 'Confirm';
        var cancelLabel = (opts && opts.cancelLabel) || 'Cancel';
        var danger = !!(opts && opts.danger);
        var onConfirm = opts && opts.onConfirm;

        var titleEl = document.getElementById(titleId);
        var messageEl = document.getElementById(messageId);
        var cancelEl = document.getElementById(cancelBtnId);
        var iconWrap = document.getElementById(iconWrapId);
        var primaryBtn = document.getElementById(primaryBtnId);
        var dangerBtn = document.getElementById(dangerBtnId);

        var activeBtn = danger ? dangerBtn : primaryBtn;
        var inactiveBtn = danger ? primaryBtn : dangerBtn;

        if (titleEl) titleEl.textContent = title;
        if (messageEl) messageEl.textContent = message;
        if (cancelEl) cancelEl.textContent = cancelLabel;

        if (activeBtn) {
            activeBtn.classList.remove('hidden');
            activeBtn.classList.add('inline-flex');
            activeBtn.innerHTML = '<span>' + confirmLabel + '</span>';
            activeBtn.disabled = false;
        }
        if (inactiveBtn) {
            inactiveBtn.classList.add('hidden');
            inactiveBtn.classList.remove('inline-flex');
        }

        if (iconWrap) {
            iconWrap.className = 'mx-auto flex items-center justify-center h-14 w-14 rounded-full border mb-4 ' + (danger ? 'bg-theme-error-bg border-theme-error-text/30' : 'bg-dashboard-background border-border');
            iconWrap.innerHTML = '<i class="fas ' + (danger ? 'fa-trash-alt text-theme-error-text' : 'fa-question text-text-secondary') + ' text-xl"></i>';
        }

        var modal = getModal();

        function closeModal() {
            if (modal) modal.hide();
        }

        // Setup cancel button
        if (cancelEl) {
            cancelEl.onclick = closeModal;
        }

        if (activeBtn) {
            if (onConfirm) {
                activeBtn.onclick = function() {
                    if (activeBtn.disabled) return;
                    activeBtn.disabled = true;
                    activeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span class="ml-2">Please wait…</span>';
                    var result = onConfirm();
                    var p = result && typeof result.then === 'function' ? result : Promise.resolve();
                    p.then(function() {
                        closeModal();
                        activeBtn.disabled = false;
                        activeBtn.innerHTML = '<span>' + confirmLabel + '</span>';
                    }).catch(function() {
                        activeBtn.disabled = false;
                        activeBtn.innerHTML = '<span>' + confirmLabel + '</span>';
                    });
                };
            } else {
                // If no onConfirm provided, just close the modal
                activeBtn.onclick = function() {
                    closeModal();
                };
            }
        }

        if (modal) modal.show();
    };
})();
</script>

<!DOCTYPE html>
<html lang="en" data-theme="system">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Preferences - Portfolio Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dashboard: {
                            surface: '#1f2937',
                            background: '#111827',
                        },
                        text: {
                            primary: '#f3f4f6',
                            secondary: '#9ca3af',
                            tertiary: '#6b7280',
                        },
                        theme: {
                            success: {
                                text: '#10b981',
                                bg: 'rgba(16, 185, 129, 0.1)',
                            },
                            error: {
                                text: '#ef4444',
                                bg: 'rgba(239, 68, 68, 0.1)',
                            }
                        },
                        accent: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <style>
        /* Mock theme classes */
        .bg-dashboard-surface { background-color: #1f2937; }
        .bg-dashboard-background { background-color: #111827; }
        .text-text-primary { color: #f3f4f6; }
        .text-text-secondary { color: #9ca3af; }
        .text-theme-error-text { color: #ef4444; }
        .text-theme-success-text { color: #10b981; }
        .bg-theme-success-bg { background-color: rgba(16, 185, 129, 0.1); }
        .bg-theme-error-bg { background-color: rgba(239, 68, 68, 0.1); }
        .form-input-theme {
            background-color: #374151;
            border-color: #4b5563;
            color: white;
            padding: 0.5rem;
            border-radius: 0.375rem;
            width: 100%;
        }
    </style>
</head>

<body class="bg-dashboard-background min-h-screen p-8 text-text-primary">
    <div class="max-w-4xl mx-auto">
        <!-- Security Settings -->
        <div class="bg-dashboard-surface rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4">🔒 Security</h2>
            <p class="text-text-secondary mb-4">Manage your account security settings.</p>

            <form id="change-password-form" class="mb-4">
                <div class="mb-4">
                    <label for="new-password" class="block text-sm font-medium text-text-secondary mb-2">
                        New Password <span class="text-theme-error-text">*</span>
                    </label>
                    <div class="relative">
                        <input type="password" id="new-password" required minlength="6" autocomplete="new-password" placeholder="••••••••"
                            class="form-input-theme pr-10">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="confirm-password" class="block text-sm font-medium text-text-secondary mb-2">
                        Confirm New Password <span class="text-theme-error-text">*</span>
                    </label>
                    <div class="relative">
                        <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password" placeholder="••••••••"
                            class="form-input-theme pr-10">
                    </div>
                </div>
                <button type="submit" id="change-password-btn"
                    class="px-4 py-2 text-accent bg-transparent border border-blue-500 text-blue-500 rounded-lg font-medium">
                    Update Password
                </button>
            </form>

            <div id="password-success" role="alert"
                class="hidden bg-theme-success-bg text-theme-success-text border border-theme-success-text rounded-lg px-4 py-3 mt-2">
                ✅ Password updated successfully!</div>
            <div id="password-error" role="alert"
                class="hidden bg-theme-error-bg text-theme-error-text border border-theme-error-text rounded-lg px-4 py-3 mt-2">
                ❌ Failed to update password.</div>
        </div>

        <!-- Timezone Settings (for role verification) -->
        <div class="bg-dashboard-surface rounded-lg shadow-lg p-6 mb-6">
             <div id="timezone-success" role="alert"
                class="hidden bg-theme-success-bg text-theme-success-text border border-theme-success-text rounded-lg px-4 py-3 mt-2">
                ✅ Timezone saved successfully!</div>
        </div>
    </div>

    <!-- Mock settings config -->
    <script id="settings-config" type="application/json">
    {
        "currentTimezone": "UTC",
        "currentCurrency": "USD",
        "currentTheme": "system"
    }
    </script>

    <!-- Load the compiled JS -->
    <script type="module" src="/web_dashboard/static/js/settings.js"></script>

    <!-- Mock CSRF and fetch -->
    <script>
        // Mock getCsrfHeaders module if needed (but we are loading module so it will try to import)
        // Since settings.js uses 'import ... from "./csrf.js"', we need to make sure that resolves or mock it.
        // We can't easily mock the import in a static file without a server serving the files.
        // However, we can use a script block with type="module" to override window.fetch

        window.fetch = async (url, options) => {
            console.log('Mock fetch called for:', url);
            // Simulate network delay to see the spinner
            await new Promise(r => setTimeout(r, 1000));
            return {
                ok: true,
                json: async () => ({ success: true })
            };
        };
    </script>
</body>
</html>
